name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db lint --local --level warning
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start browser test services
        run: |
          printf '\n[inbucket]\nport = 55424\n' >> supabase/config.toml
          npx supabase start --exclude studio,imgproxy,logflare,vector,postgres-meta,realtime,edge-runtime >/dev/null
      - name: Read the local public key
        run: |
          publishable_key="$(npx supabase status -o env | awk -F'"' '/^PUBLISHABLE_KEY=/{print $2}')"
          test -n "$publishable_key"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_EMAIL_AUTH_ENABLED: 'true'
          E2E_MAILPIT_URL: http://127.0.0.1:55424
      - if: always()
        run: npx supabase stop --no-backup
